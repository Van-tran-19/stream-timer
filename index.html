<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream Timer</title>
    <style>
        /* Transparence absolue pour OBS */
        body, html {
            margin: 0;
            padding: 0;
            background-color: transparent !important;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Style de la boîte du timer */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        #mode-text {
            font-size: 1.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        #timer {
            font-size: 6rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <div id="mode-text">Study</div>
        <div id="timer">50:00</div>
    </div>

    <script>
        // ==========================================
        // PERSONNALISE TES TEMPS ICI (en minutes)
        // ==========================================
        const STUDY_MINUTES = 60; 
        const BREAK_MINUTES = 10; 
        // ==========================================

        const WORK_TIME = STUDY_MINUTES * 60;
        const BREAK_TIME = BREAK_MINUTES * 60;
        
        let timeLeft = WORK_TIME;
        let isStudySession = true;
        let isPaused = false;

        const timerDisplay = document.getElementById('timer');
        const modeDisplay = document.getElementById('mode-text');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function countTimer() {
            if (isPaused) return;

            if (timeLeft > 0) {
                timeLeft--;
            } else {
                // Basculement automatique Study <-> Break à la fin du décompte
                isStudySession = !isStudySession;
                timeLeft = isStudySession ? WORK_TIME : BREAK_TIME;
                modeDisplay.textContent = isStudySession ? "Study" : "Break";
            }
            updateDisplay();
        }

        // Lancer le timer toutes les secondes
        setInterval(countTimer, 1000);
        updateDisplay();

        // Contrôle au clavier pour piloter le timer à distance
        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();

            if (key === ' ') { // Touche ESPACE = Pause / Reprise
                event.preventDefault();
                isPaused = !isPaused;
            } else if (key === 's') { // Touche S = Force le mode Study
                isStudySession = true;
                timeLeft = WORK_TIME;
                modeDisplay.textContent = "Study";
                isPaused = false;
                updateDisplay();
            } else if (key === 'b') { // Touche B = Force le mode Break
                isStudySession = false;
                timeLeft = BREAK_TIME;
                modeDisplay.textContent = "Break";
                isPaused = false;
                updateDisplay();
            } else if (key === 'r') { // Touche R = Reset le timer actuel
                timeLeft = isStudySession ? WORK_TIME : BREAK_TIME;
                isPaused = false;
                updateDisplay();
            }
        });
    </script>

</body>
</html>
